name: Daily Current Affairs Sync

on:
  schedule:
    # Run daily at 6:00 AM IST (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  sync-current-affairs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch current affairs from kolom.in
        run: node scripts/fetch-current-affairs.cjs

      - name: Merge new items into data file
        run: node scripts/merge-current-affairs.cjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/data/currentAffairs.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new current affairs to add."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New current affairs found!"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/currentAffairs.ts
          git commit -m "chore: daily current affairs sync from kolom.in [skip ci]"
          git push
