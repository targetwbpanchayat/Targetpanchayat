name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Set Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Setting secrets for Edge Functions..."
          supabase secrets set SMTP_USER="${{ secrets.SMTP_USER }}" SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" SMTP_FROM_NAME="${{ secrets.SMTP_FROM_NAME }}" --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy send-otp function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy send-otp --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy verify-otp function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy verify-otp --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy reset-password function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy reset-password --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Done
        run: echo "All Edge Functions deployed!"
